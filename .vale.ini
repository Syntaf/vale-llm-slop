# Config used to develop and test this repo. Consumers do NOT inherit this —
# see README.md for how to wire the styles into your own .vale.ini.
StylesPath = styles
MinAlertLevel = suggestion

# The primary target: prose written by agents inside source files.
[testdata/comments-*.{py,cs}]
BasedOnStyles = Slop

# Carve-outs for technical vocabulary. Same styles as the comment fixtures;
# without a section of its own this file matched no glob and was never linted.
[testdata/exclusions-*.py]
BasedOnStyles = Slop

# Secondary target: agent-authored specs and plans.
[testdata/spec-*.md]
BasedOnStyles = Slop

[testdata/ste-*.md]
BasedOnStyles = STE
